<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hocus Pets</title>

  <link rel="shortcut icon" href="Logo.webp" type="image/x-icon"/>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo" onclick="scrollTopPage()">
    <img src="Logo.webp"/>
    <span>Hocus Pets</span>
  </div>

  <div id="userArea">
    <button id="navAuthBtn">Login</button>

    <div id="userDropdown" class="dropdown">
      <div id="userEmail"></div>

      <button id="changePasswordBtn">
        Change Password
      </button>

      <button id="logoutBtn">
        Logout
      </button>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Magical Care for Your Pets</h1>

  <p>
    Professional pet sitting, walking, transportation and care with love and safety.
  </p>

  <button class="cta" onclick="scrollToServices()">
    Book a Service
  </button>
</section>

<!-- SERVICES -->
<section class="services fade" id="services"></section>

<!-- TEAM -->
<section class="team fade" id="team"></section>

<!-- CONTACT -->
<section class="contact fade" id="contact">
  <h1>Contact Us</h1>

  <form id="contact-form">

    <input 
      type="text"
      name="name"
      placeholder="Your Name"
      required
    />

    <input 
      type="hidden"
      name="time"
      id="time"
    />

    <input 
      type="email"
      name="email"
      id="contactEmail"
      placeholder="Your Email"
      required
    />

    <select 
      name="service"
      id="serviceSelect"
      required
    >
      <option value="">Select a Service</option>
      <option>Pet Sitting</option>
      <option>Pet Walking</option>
      <option>Food Delivery</option>
      <option>Transportation</option>
      <option>Playtime</option>
      <option>Exotic Pets</option>
    </select>

    <textarea 
      name="message"
      placeholder="Your Message"
      required
    ></textarea>

    <button type="submit">
      Send Message
    </button>

  </form>
</section>

<footer>
  Hocus Pets
</footer>

<!-- DARK OVERLAY -->
<div id="overlay"></div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">

  <div class="modal-content">

    <h2>Login / Sign Up</h2>

    <input 
      id="authEmail"
      type="email"
      placeholder="Email"
    />

    <input 
      id="authPassword"
      type="password"
      placeholder="Password"
    />

    <input 
      id="authConfirmPassword"
      type="password"
      placeholder="Confirm Password (Sign Up only)"
    />

    <button id="loginBtn">
      Login
    </button>

    <button id="signupBtn">
      Sign Up
    </button>

    <button class="closeBtn" onclick="closeLogin()">
      Close
    </button>

  </div>

</div>

<!-- CHANGE PASSWORD MODAL -->
<div id="changePasswordModal" class="modal">

  <div class="modal-content">

    <h2>Reset Password</h2>

    <input 
      id="resetEmail"
      type="email"
      placeholder="Enter your email"
    />

    <button id="sendResetBtn">
      Send Reset Email
    </button>

    <button 
      class="closeBtn"
      onclick="closeChangePassword()"
    >
      Close
    </button>

  </div>

</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<!-- MAIN SCRIPT -->
<script type="module" src="script.js"></script>

</body>
</html>
