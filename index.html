<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hocus Pets</title>
<link rel="shortcut icon" href="Logo.webp" type="image/x-icon">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
color:white;
overflow-x:hidden;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
position:sticky;
top:0;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
z-index:1000;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:22px;
font-weight:700;
color:#F2C185;
cursor:pointer;
}

.logo img{
height:45px;
border-radius:10px;
}

nav button{
padding:10px 20px;
border-radius:30px;
border:none;
background:linear-gradient(135deg,#F285A2,#F2C185);
color:white;
cursor:pointer;
}

/* HERO */

.hero{
min-height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.hero h1{
font-size:60px;
background:linear-gradient(90deg,#F285A2,#3B9CD9);
-webkit-background-clip:text;
color:transparent;
}

.hero p{
margin-top:15px;
color:#cbd5e1;
max-width:600px;
}

.cta{
margin-top:30px;
padding:15px 30px;
font-size:18px;
border-radius:40px;
border:none;
background:linear-gradient(135deg,#F2C185,#F285A2);
cursor:pointer;
transition:.3s;
}

.cta:hover{
transform:scale(1.1);
}

/* SERVICES */

.services{
padding:80px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 30px rgba(255,255,255,0.1);
}

.card h2{
color:#F2C185;
}

.card button{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:30px;
background:#3B9CD9;
color:white;
cursor:pointer;
}

/* TEAM */

.team{
padding:80px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.member{
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
}

.member h3{
color:#F285A2;
}

/* CONTACT */

.contact{
padding:80px 8%;
text-align:center;
}

form{
max-width:500px;
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
}

input,textarea{
padding:15px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
}

textarea{
height:120px;
resize:none;
}

form button{
padding:15px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#F285A2,#3B9CD9);
color:white;
cursor:pointer;
}

footer{
text-align:center;
padding:30px;
color:#94a3b8;
}

/* ANIMATION */

.fade{
opacity:0;
transform:translateY(40px);
transition:1s;
}

.fade.show{
opacity:1;
transform:translateY(0);
}

</style>
</head>

<body>

<nav>
<div class="logo" onclick="scrollTopPage()">
<img src="Logo.webp">
<span>Hocus Pets</span>
</div>

<button onclick="scrollToServices()">Book Now</button>
</nav>

<section class="hero">
<h1>Magical Care for Your Pets</h1>
<p>Professional pet sitting, walking, transportation and care with love and safety.</p>

<button class="cta" onclick="scrollToServices()">Book a Service</button>
</section>

<section class="services fade" id="services"></section>

<section class="team fade" id="team"></section>

<section class="contact fade" id="contact">
<h1>Contact Us</h1>

<form id="contact-form">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<input type="text" id="serviceField" name="service" placeholder="Selected Service">

<textarea name="message" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

</form>
</section>

<footer>
Hocus Pets
</footer>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

/* SERVICES */

const services = [
["Pet Sitting","€20 - €30"],
["Pet Walking","€10 - €20"],
["Food Delivery","€5 - €15"],
["Transportation","€15 - €25"],
["Playtime","€10 - €18"],
["Exotic Pets","€25 - €40"]
];

const sDiv = document.getElementById("services");

services.forEach(s=>{
sDiv.innerHTML += `
<div class="card fade">
<h2>${s[0]}</h2>
<p>${s[1]}</p>
<button onclick="bookService('${s[0]}')">Book</button>
</div>
`;
});

/* TEAM */

const team = [
{
name:"Andrea Borg",
role:"Co-Founder",
desc:"Passionate about animals and technology, bringing magical care to pets."
},
{
name:"Selena Formosa",
role:"Co-Founder",
desc:"Dedicated to caring for animals with love and professionalism."
}
];

const tDiv = document.getElementById("team");

team.forEach(m=>{
tDiv.innerHTML += `
<div class="member fade">
<h2>${m.name}</h2>
<h3>${m.role}</h3>
<p>${m.desc}</p>
</div>
`;
});

/* SCROLL */

function scrollToContact(){
const section = document.getElementById("contact");
const offset = 100;

window.scrollTo({
top: section.offsetTop - offset,
behavior: "smooth"
});
}

function scrollToServices(){
const section = document.getElementById("services");
const offset = 100;

window.scrollTo({
top: section.offsetTop - offset,
behavior: "smooth"
});
}
function scrollTopPage(){
window.scrollTo({top:0,behavior:"smooth"});
}

/* BOOK SERVICE AUTO FILL */

function bookService(service){

document.getElementById("serviceField").value = service;

scrollToContact();

}

/* EMAILJS */

emailjs.init("166hcYD_eEyhQSA-t");

document.getElementById("contact-form").addEventListener("submit", function(e){

e.preventDefault();

emailjs.sendForm(
"service_bzchcep",
"template_pc70ul6",
this
)
.then(function(){

alert("Message sent successfully ✨");
document.getElementById("contact-form").reset();

}, function(error){

alert("Failed to send ❌");

});

});

/* FADE ANIMATION */

const faders = document.querySelectorAll(".fade");

window.addEventListener("scroll", ()=>{

document.querySelectorAll(".fade").forEach(el=>{
const top = el.getBoundingClientRect().top;

if(top < window.innerHeight - 100){
el.classList.add("show");
}
});

});

</script>

</body>
</html>
